name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check

  frontend-tests:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      # The prepare script also installs Cypress's browser binary.
      - run: npm ci
      - name: TypeScript checks and production build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit -- --run
      # These suites use intercepted API responses or mock repositories.
      # Real-stack tests will be added separately.
      - name: Cypress tests against the built frontend
        run: npm run test:e2e
      - name: Cypress tests against mock repositories
        run: npm run test:e2e:mock
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-diagnostics
          path: |
            src/frontend/cypress/screenshots/
            src/frontend/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

  backend-tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend/django
    env:
      SECRET_KEY: ci-only-key-not-used-outside-the-test-run
      DEBUG: "false"
      USE_POSTGRESQL: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      POSTGRES_DB: subscriptionguard_ci
      POSTGRES_USER: subscriptionguard_ci
      POSTGRES_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: subscriptionguard_ci
          POSTGRES_USER: subscriptionguard_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subscriptionguard_ci -d subscriptionguard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/backend/django/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  docker-builds:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate integration and development configuration
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.dev.yml config --quiet
      - name: Build application images without publishing
        run: docker compose -f compose.yml build

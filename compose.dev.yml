# Use together with compose.yml, never on its own.
services:
  migrate:
    volumes:
      - ./src/backend/django:/app

  backend:
    command: [python, manage.py, runserver, "0.0.0.0:8000"]
    environment:
      DEBUG: "true"
    volumes:
      - ./src/backend/django:/app

  frontend:
    build:
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_MOCK_REPOSITORIES: "false"
      VITE_DEV_API_USERNAME: ${LOCAL_API_USERNAME:-demo}
      VITE_DEV_API_PASSWORD: ${LOCAL_API_PASSWORD:-local-demo-password}
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    # Refresh dependencies after lockfile changes and when reusing the volume.
    command: [sh, -c, "npm ci && exec npm run dev -- --host 0.0.0.0 --port 8080 --strictPort"]
    healthcheck:
      start_period: 120s

volumes:
  frontend_node_modules:

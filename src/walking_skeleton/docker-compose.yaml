services:
  web:
    #image: ghcr.io/se-team-e1/se-subscriptionguard/backend:v1.0.0
    image: ghcr.io/se-team-e1/se-subscriptionguard:0.0.7
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/se-team-e1/se-subscriptionguard/frontend:0.0.2
    expose:
      - "8001"
    depends_on:
      - web
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - frontend
    ports:
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: subscriptionguard-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: subscriptionguard-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

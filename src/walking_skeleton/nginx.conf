worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    error_log     /dev/stderr warn;

    # Upstream Frontend (Vue app container)
    upstream frontend_app {
        server frontend:8001;
    }

    # Upstream Backend (Django app container)
    upstream django_app {
        server web:8000;
    }

    server {
        listen 8001; # This is the public-facing port on your host machine
        server_name _;

        # 1) Pass API requests to Django
        location ^~ /api/ {
            proxy_pass http://django_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2) Pass all other traffic directly to the Vue Frontend container
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

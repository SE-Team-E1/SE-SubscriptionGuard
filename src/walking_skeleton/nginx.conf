worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Errors to stderr (container-friendly)
    error_log /dev/stderr warn;

    # Upstream (Django)
    upstream django_app {
        server web:8000;
    }

    server {
        listen 8001;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 1) Static assets: check file, otherwise return 404 (so missing assets do not return index.html)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 2) API proxy (adjust prefix if needed)
        location /api/ {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3) SPA fallback: all other requests serve index.html so client router can handle routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
